[project]
name = "wf"
version = "0.1.0"
description = "WildfireTD4: four-scale custom wildfire progression segmentation with focal Tversky loss"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "scikit-learn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
external = ["pandas", "pyarrow", "rasterio", "pytest"]
test = ["pytest"]
comparisons = ["segmentation-models-pytorch", "timm", "pandas"]

[project.scripts]
wildfire = "wf.__main__:main"
